<!doctype html>
<!-- FlopTop – lecteur YouTube relais. À héberger en HTTPS (GitHub Pages / Cloudflare Pages).
     L'app iOS (origine capacitor://) ne transmet pas de Referer : YouTube répond « erreur 152/153 ».
     Cette page, servie en https, intègre la vidéo avec un Referer valide ; l'app l'affiche en iframe dans la carte. -->
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin"><title>FlopTop</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head>
<body><script>
(function(){var p=new URLSearchParams(location.search),v=p.get('v')||'';if(!/^[A-Za-z0-9_-]{11}$/.test(v))return;
var f=document.createElement('iframe');
f.src='https://www.youtube-nocookie.com/embed/'+v+'?playsinline=1&rel=0&modestbranding=1'+(p.get('autoplay')==='1'?'&autoplay=1':'')+'&origin='+encodeURIComponent(location.origin);
f.referrerPolicy='strict-origin-when-cross-origin';f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;
document.body.appendChild(f)})();
</script></body></html>
